name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer and Linux dependencies
        run: |
          sudo apt-get update
          # Устанавливаем официальный sdkmanager прямо из репозитория Linux (пакет google-android-cmdline-tools-installer)
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake wget google-android-cmdline-tools-installer
          
          # Обновляем пип и ставим сборщики
          pip install --upgrade pip
          pip install buildozer cython

      - name: Manual SDK & Sdkmanager Link Fix
        run: |
          # 1. Создаем структуру папок, которую жестко требует Buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          
          # 2. Находим, куда Linux установил системный sdkmanager
          SYSTEM_SDKMANAGER="/usr/lib/android-sdk/cmdline-tools/tools/bin/sdkmanager"
          
          # 3. Копируем или связываем системный менеджер с папками Buildozer
          if [ -f "$SYSTEM_SDKMANAGER" ]; then
            ln -sf "$SYSTEM_SDKMANAGER" ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager
            ln -sf "$SYSTEM_SDKMANAGER" ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
            echo "Системный sdkmanager успешно привязан к среде Buildozer!"
          fi
          
          # 4. Принудительно принимаем все лицензии Google
          yes | sdkmanager --licenses --sdk_root=$HOME/.buildozer/android/platform/android-sdk || true

      - name: Init and Configure Buildozer
        run: |
          buildozer init
          
          # Корректируем базовые настройки приложения
          sed -i 's/title = My Application/title = Goida AI Unlocker/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = goidaunlocker/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,pyjnius/g' buildozer.spec
          
          # Указываем использовать уже настроенные лицензии
          sed -i 's/.*android.accept_sdk_license =.*/android.accept_sdk_license = True/g' buildozer.spec
          sed -i 's/.*android.permissions =.*/android.permissions = INTERNET, BIND_VPN_SERVICE/g' buildozer.spec

      - name: Build APK
        run: |
          buildozer -v android debug
