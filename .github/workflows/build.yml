name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake wget

      - name: Install Buildozer and tools
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Pre-install Android SDK Build-Tools 34 (Fix Aidl)
        run: |
          # Вручную создаем структуру папок, которую ожидает Buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0
          
          # Скачиваем официальные стабильные инструменты Google (34-ю версию)
          wget https://google.com -O build-tools.zip
          unzip build-tools.zip
          
          # Обманываем Buildozer: подсовываем стабильные файлы (включая утилиту aidl) в папку 37.0.0
          cp -r android-14/* ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0/
          
          # Проверяем, что обман сработал и файл на месте
          chmod +x ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0/aidl
          echo "Утилита Aidl успешно внедрена вручную!"

      - name: Init and Configure Buildozer
        run: |
          buildozer init
          sed -i 's/title = My Application/title = Goida AI Unlocker/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = goidaunlocker/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,pyjnius/g' buildozer.spec
          sed -i 's/.*android.accept_sdk_license =.*/android.accept_sdk_license = True/g' buildozer.spec
          sed -i 's/.*android.permissions =.*/android.permissions = INTERNET, BIND_VPN_SERVICE/g' buildozer.spec

      - name: Build APK
        run: |
          # Запуск сборки
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Goida-AI-Unlocker-APK
          path: bin/*.apk
