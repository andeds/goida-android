name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

      - name: Install Buildozer and tools
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Init and Configure Buildozer
        run: |
          buildozer init
          # Настройка параметров приложения
          sed -i 's/title = My Application/title = Goida AI Unlocker for Android/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = goidaunlocker/g' buildozer.spec
          sed -i 's/#android.permissions =/android.permissions = INTERNET, BIND_VPN_SERVICE/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,pyjnius/g' buildozer.spec
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec

      - name: Auto-Accept Android SDK Licenses
        run: |
          # 1. Вызываем встроенный менеджер SDK, чтобы он скачал базовые компоненты
          buildozer android sdk || true
          
          # 2. Находим утилиту sdkmanager внутри папки buildozer и принудительно принимаем все лицензии
          SDKMANAGER_PATH=$(find ~/.buildozer/ -name "sdkmanager" -print -quit)
          if [ -n "$SDKMANAGER_PATH" ]; then
            echo "Найдена утилита sdkmanager, принимаем лицензии..."
            yes | $SDKMANAGER_PATH --licenses
          else
            echo "sdkmanager не найден на этом этапе, лицензии будут приняты встроенным методом"
          fi

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Goida-AI-Unlocker-APK
          path: bin/*.apk
