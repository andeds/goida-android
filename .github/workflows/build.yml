```yaml
name: Build Flet APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 1. Получаем исходный код
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      # ВАЖНО: v4 вместо v3.
      # v3 пытается установить устаревший пакет "tools".
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 5. Устанавливаем Flet
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade flet

      # 6. Проверяем Python и Flet
      - name: Check environment
        run: |
          python --version
          flet --version

      # 7. Собираем APK
      - name: Build Android APK
        run: |
          flet build apk \
            --title "Goida AI Unlocker" \
            --package-name "com.andeds.goidaunlocker"

      # 8. Загружаем APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Goida-APK
          path: build/apk/*.apk
          if-no-files-found: error
```
