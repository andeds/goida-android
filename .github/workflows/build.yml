name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

      - name: Install Buildozer and tools
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Init and Configure Buildozer
        run: |
          buildozer init
          
          # Настройка базовых параметров
          sed -i 's/title = My Application/title = Goida AI Unlocker/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = goidaunlocker/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,pyjnius/g' buildozer.spec
          
          # Принудительно выставляем жесткие стабильные версии Android 14, стирая старые строки
          sed -i 's/.*android.api =.*/android.api = 34/g' buildozer.spec
          sed -i 's/.*android.build_tools_version =.*/android.build_tools_version = 34.0.0/g' buildozer.spec
          
          # Включаем автоматическое принятие лицензий на уровне самого Buildozer
          sed -i 's/.*android.accept_sdk_license =.*/android.accept_sdk_license = True/g' buildozer.spec
          
          # Добавляем права доступа к VPN и Интернету
          sed -i 's/.*android.permissions =.*/android.permissions = INTERNET, BIND_VPN_SERVICE/g' buildozer.spec

      - name: Build APK
        run: |
          # Включаем глобальный флаг для автоматического принятия всех лицензий Android SDK на уровне ядра Linux
          export ANDROID_LAUNCHER_ACCEPT_SDK_LICENSE=1
          buildozer -v android debug
        env:
          # Дополнительный системный флаг для автоматизации Java/Gradle инструментов
          AUTO_ACCEPT_AND_CONTINUE: "y"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Goida-AI-Unlocker-APK
          path: bin/*.apk
