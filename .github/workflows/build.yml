name: Build Flet APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Получаем проект
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'


      # ============================================================
      # 4. Python 3.11
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ============================================================
      # 5. Flutter SDK
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true


      # ============================================================
      # 6. Проверяем Flutter
      # ============================================================
      - name: Check Flutter
        run: |
          flutter --version
          dart --version


      # ============================================================
      # 7. Показываем файлы проекта
      # ============================================================
      - name: Show project files
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 2 -type f | sort


      # ============================================================
      # 8. Обновляем pip
      # ============================================================
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      # ============================================================
      # 9. Устанавливаем Flet
      # ============================================================
      - name: Install Flet
        run: |
          python -m pip install --upgrade flet


      # ============================================================
      # 10. Проверяем окружение
      # ============================================================
      - name: Check environment
        run: |
          python --version
          pip --version
          flet --version
          java -version


      # ============================================================
      # 11. Проверяем Android SDK
      # ============================================================
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          adb --version


      # ============================================================
      # 12. Устанавливаем Android компоненты
      # ============================================================
      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # ============================================================
      # 13. Сборка APK
      # ============================================================
      - name: Build Android APK
        run: |
          flet build apk \
            --product "Goida AI Unlocker" \
            --org "com.andeds" \
            --bundle-id "com.andeds.goidaunlocker"


      # ============================================================
      # 14. Проверяем результат
      # ============================================================
      - name: Show build files
        run: |
          echo "===== BUILD DIRECTORY ====="
          find build -type f -print || true


      # ============================================================
      # 15. Загружаем APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Goida-AI-Unlocker-APK
          path: build/apk/*.apk
          if-no-files-found: error
