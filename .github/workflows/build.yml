name: Build Flet APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 1. Настраиваем Java (необходима для компиляции Android-приложений)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Автоматически разворачиваем Android SDK и соглашаемся со всеми лицензиями
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 3. Настраиваем стабильный Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Настраиваем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 5. Устанавливаем Flet CLI для сборки
      - name: Install Flet CLI
        run: |
          pip install --upgrade pip
          pip install flet

      # 6. Запускаем компиляцию APK
      - name: Build Android APK
        run: |
          flet build apk --title "Goida AI Unlocker" --package-name "com.andeds.goidaunlocker"

      # 7. Загружаем готовый APK-файл в артефакты GitHub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Goida-APK
          path: build/apk/*.apk
