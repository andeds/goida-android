name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

      - name: Install Buildozer and tools
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Init and Configure Buildozer
        run: |
          buildozer init
          
          # Настройка базовых параметров
          sed -i 's/title = My Application/title = Goida AI Unlocker/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = goidaunlocker/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,pyjnius/g' buildozer.spec
          sed -i 's/.*android.accept_sdk_license =.*/android.accept_sdk_license = True/g' buildozer.spec
          sed -i 's/.*android.permissions =.*/android.permissions = INTERNET, BIND_VPN_SERVICE/g' buildozer.spec

      - name: Fix Sdkmanager Path Bug
        run: |
          # 1. Заставляем Buildozer создать базовую структуру папок SDK перед сборкой
          buildozer android sdk || true
          
          # 2. Исправляем баг путей: создаем старую папку, которую ищет Buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          
          # 3. Находим, куда Google реально установил sdkmanager, и создаем туда прямую ссылку (Symlink)
          REAL_SDKMANAGER=$(find ~/.buildozer/android/platform/ -name "sdkmanager" -print -quit)
          if [ -n "$REAL_SDKMANAGER" ]; then
            echo "Найден реальный sdkmanager в: $REAL_SDKMANAGER"
            ln -sf "$REAL_SDKMANAGER" ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
            echo "Баг путей успешно исправлен!"
          else
            echo "Предупреждение: sdkmanager еще не скачан, ссылка будет проверена во время сборки."
          fi

      - name: Build APK
        run: |
          # Запуск чистой сборки без ломающих пайпы команд
          buildozer -v android debug
